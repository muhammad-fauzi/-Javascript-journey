<!DOCTYPE html>

    <link rel="stylesheet" href="bikinsoal.css">
    <title>SOAL UJIAN OTOMATIS</title>
</head>
<body>
    <div id="container">
        <div class="containerbox">
            <div id="tombolsoal">
                <div class="soaltitle">
                    <p>Soal Nomor</p>
                </div>
                <button class="soal1">1</button>
                <button class="soal2">2</button>
                <button class="soal3">3</button>
            </div>
            <div id="pertanyaan">
                <div class="pertanyaantitle">
                    <p>Pertanyaan Muncul di Bawah Sini</p>
                </div>
                <!--pertanyaan & pilihan muncul di sini-->
            </div>
            <div id="tombolselesai">
                <!--tombol selesai muncul di sini-->
                <div class="score">
                    <!--score muncul di sini-->
                </div>
            </div>
        </div>
    </div>   
    <script src="bikinsoal.js"></script>

</html>
